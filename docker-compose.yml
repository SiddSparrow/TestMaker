#version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-maker-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    networks:
      - laravel-network
    depends_on:
      - postgres
      - redis
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-maker-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - laravel-network
    depends_on:
      - postgres
      - redis
    command: php artisan queue:work --tries=2 --timeout=300 --verbose

  postgres:
    image: postgres:15-alpine
    container_name: test-maker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: test-maker
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - laravel-network


  redis:
    image: redis:7-alpine
    container_name: test-maker-redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 256mb  
      --maxmemory-policy allkeys-lru  
      --save 900 1      
      --save 300 10     
      --save 60 10000   
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}  


  mailhog:
    image: mailhog/mailhog:latest
    container_name: test-maker-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - laravel-network

volumes:
  postgres_data:
  redis_data:
    driver: local

networks:
  laravel-network:
    driver: bridge